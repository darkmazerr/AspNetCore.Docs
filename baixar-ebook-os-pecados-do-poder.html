<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baixar eBook — OS PECADOS DO PODER</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d4af37;
      --matte-black: #070707;
      --soft-white: #f2efe6;
    }

    body {
      align-items: center;
      background: radial-gradient(circle at top, #1f1a10, var(--matte-black) 52%);
      color: var(--soft-white);
      display: flex;
      font-family: Georgia, 'Times New Roman', serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      border: 1px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
      max-width: 760px;
      padding: 3rem;
      text-align: center;
    }

    h1 {
      color: var(--gold);
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      letter-spacing: 0.08em;
      margin: 0 0 1rem;
      text-transform: uppercase;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin: 0 auto 2rem;
      max-width: 42rem;
    }

    a {
      background: linear-gradient(135deg, #f6dd82, var(--gold) 45%, #8f6f17);
      border-radius: 999px;
      color: #080808;
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 1rem 1.6rem;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:focus,
    a:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <h1>OS PECADOS DO PODER</h1>
    <p>Use o botão abaixo para baixar a versão em PDF do eBook premium sobre ambição, riqueza, influência e construção de patrimônio.</p>
    <a href="./ebook-os-pecados-do-poder.pdf" download>Baixar PDF</a>
  </main>
</body>
</html>
